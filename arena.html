<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>POLYPONG — Arena</title>
<link rel="stylesheet" href="./src/shell.css" />

<canvas id="stage"></canvas>

<div id="lobby" class="overlay">
  <div class="panel wide">
    <h1>POLY<span>PONG</span></h1>
    <div class="tag">students join from any browser on this network</div>

    <div class="joinbox">
      <div class="joinlabel">JOIN AT</div>
      <div id="joinurl" class="joinurl">…</div>
    </div>

    <div id="seats" class="seats"></div>
    <div id="empty" class="empty">Waiting for students to join…</div>

    <div class="row">
      <div class="field">
        <label>FILL WITH BOTS</label>
        <select id="bots"></select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="start">START GAME</button>
      </div>
    </div>
    <div id="err" class="err"></div>
  </div>
</div>

<div id="hud" class="teacherbar hidden">
  <button id="pause" class="mini">PAUSE</button>
  <button id="reset" class="mini">END GAME</button>
  <span id="conn" class="conn">connected</span>
</div>

<!-- Projected question. DOM, not canvas — render.js is owned elsewhere, and
     the class needs selectable, zoomable, screen-reader-visible text anyway.
     Who answered what is NOT shown here unless the teacher opts in. -->
<div id="quizwall" class="quizwall hidden" aria-live="polite">
  <div class="quizwallcard">
    <div class="qwhy" id="wallwhy"></div>
    <div class="walltext" id="walltext"></div>
    <ol class="wallopts" id="wallopts"></ol>
    <div class="wallcount" id="wallcount"></div>
    <div class="wallrows" id="wallrows"></div>
  </div>
</div>

<script type="module" src="./src/arena.js"></script>
