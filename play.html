<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>POLYPONG — Play</title>
<link rel="stylesheet" href="./src/shell.css" />

<div id="join" class="overlay">
  <div class="panel">
    <h1>POLY<span>PONG</span></h1>
    <div class="tag">type your name and join the game</div>
    <div class="field">
      <label>YOUR NAME</label>
      <input id="name" maxlength="14" autocomplete="off" autocapitalize="words" placeholder="e.g. Maya" />
    </div>
    <div style="height:12px"></div>
    <button id="go">JOIN</button>
    <div id="joinerr" class="err"></div>
  </div>
</div>

<div id="pad" class="pad hidden">
  <div class="padtop">
    <span class="dot" id="mycolor"></span>
    <span class="padname" id="myname"></span>
    <span class="padlives" id="mylives"></span>
  </div>
  <div class="padview">
    <canvas id="mini"></canvas>
    <div class="padstatus" id="status"></div>
  </div>
  <div class="padbtns">
    <button class="big" id="left">◀</button>
    <button class="big drop" id="drop">DROP IT</button>
    <button class="big" id="right">▶</button>
  </div>
</div>

<!-- End of match. Shown to every student, including the ones knocked out early:
     they stay seated for the rematch, so the screen must not just go quiet. -->
<div id="over" class="over hidden" aria-live="polite">
  <div class="overcard">
    <div class="overwho" id="overwho"></div>
    <div class="oversub" id="oversub"></div>
  </div>
</div>

<!-- Question overlay. Deliberately DOM, not canvas: real text selection, real
     focus order, and a screen reader can actually read it. -->
<div id="quiz" class="quiz hidden" role="dialog" aria-modal="true" aria-labelledby="qtext">
  <div class="quizcard">
    <div class="quizmeta">
      <span id="qwhy"></span>
      <span id="qtimer" class="qtimer" role="timer" aria-live="off"></span>
    </div>
    <h2 id="qtext" class="qtext"></h2>
    <div id="qopts" class="qopts" role="group" aria-labelledby="qtext"></div>
    <p id="qstatus" class="qstatus" aria-live="polite"></p>
  </div>
</div>

<script type="module" src="./src/play.js"></script>
